buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        // Use an NDK version that has source.properties (e.g. install via Android Studio SDK Manager)
        ndkVersion = "26.1.10909125"
        // LiveKit's native module (@livekit/react-native) requires Kotlin 1.9.25.
        // The 1.9.25 plugin also redirects the (no-longer-published) kotlin-stdlib-common
        // to kotlin-stdlib, avoiding a fallthrough to the sunset OSSRH snapshots repo.
        kotlinVersion = "1.9.25"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
