# coturn configuration for Bike Chat TURN relay.
#
# This uses the "use-auth-secret" REST scheme: the backend mints short-lived
# credentials from TURN_SECRET (which must equal `static-auth-secret` below), so
# no static password is ever shipped to clients.
#
# Replace the CAPITALISED placeholders before deploying.

# --- Listening ---
listening-port=3478
tls-listening-port=5349
# Bind to all interfaces on the host.
listening-ip=0.0.0.0

# On a cloud VM whose public IP is NAT'd to a private NIC address, map them so
# coturn advertises the reachable public IP. Format: external-ip=PUBLIC/PRIVATE
# (drop the "/PRIVATE" part if the machine holds the public IP directly).
external-ip=PUBLIC_IP

# --- Auth (time-limited REST credentials) ---
use-auth-secret
static-auth-secret=REPLACE_WITH_TURN_SECRET
realm=turn.YOURDOMAIN

# --- Relay port range ---
# coturn allocates one relay port per session from this range. Open these UDP
# ports on the machine's firewall / cloud security group. A small range is plenty
# for a handful of test riders.
min-port=49160
max-port=49200

# --- TLS (turns:) — point at real certs if you have a domain, else drop 5349 ---
# cert=/etc/letsencrypt/live/turn.YOURDOMAIN/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.YOURDOMAIN/privkey.pem

# --- Hardening ---
no-tlsv1
no-tlsv1_1
no-cli
# Don't relay to private/loopback ranges (SSRF protection).
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# --- Logging ---
log-file=stdout
verbose
